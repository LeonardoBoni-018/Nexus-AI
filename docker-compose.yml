# Ambiente completo: PostgreSQL + backend + frontend (nginx). Uso:
#   cp .env.example .env   (edite DB_PASSWORD e, opcionalmente, as variaveis de IA)
#   docker compose up --build
# Acesse http://localhost:8081
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nexus
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no arquivo .env}
    volumes:
      - nexus-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/nexus
      DB_USER: nexus
      DB_PASSWORD: ${DB_PASSWORD}
      # O frontend em nginx e servido por HTTP no ambiente local; em producao use HTTPS e COOKIE_SECURE=true.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      DEMO_SEED: ${DEMO_SEED:-true}
      REQUIRE_SEPARATE_APPROVER: ${REQUIRE_SEPARATE_APPROVER:-false}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-false}
      AI_PROVIDER: ${AI_PROVIDER:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf \"GET /actuator/health/liveness HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q UP <&3'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8081:80"

volumes:
  nexus-db:
